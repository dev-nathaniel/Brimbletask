global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: [ "localhost:9090" ]

  - job_name: "nomad"
    static_configs:
      - targets: [ "host.docker.internal:4646" ]
    metrics_path: "/v1/metrics"
    params:
      format: [ "prometheus" ]

  - job_name: "consul"
    static_configs:
      - targets: [ "host.docker.internal:8500" ]
    metrics_path: "/v1/agent/metrics"
    params:
      format: [ "prometheus" ]
